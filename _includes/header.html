<a class="skip" href="#main">Skip to main content</a>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ s.my_name }}, home">{{ s.my_name }}</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav"><span class="menu-lines" aria-hidden="true"></span><span class="menu-label">Menu</span></button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {%- assign here = page.url -%}
        <li><a href="{{ '/' | relative_url }}" {% if here == '/' %}aria-current="page"{% endif %}>Home</a></li>
        <li><a href="{{ '/projects/' | relative_url }}" {% if here contains '/projects/' or here contains '/reflections/' %}aria-current="page"{% endif %}>Projects</a></li>
        <li><a href="{{ '/about/' | relative_url }}" {% if here contains '/about/' %}aria-current="page"{% endif %}>About</a></li>
        {%- if s.linkedin and s.linkedin != "" %}<li><a href="{{ s.linkedin }}" rel="me noopener" target="_blank">LinkedIn<span class="visually-hidden"> (opens in a new tab)</span></a></li>{% endif %}
        <li><a class="nav-hello" href="mailto:{{ s.email }}">Say hello</a></li>
      </ul>
    </nav>
  </div>
</header>
