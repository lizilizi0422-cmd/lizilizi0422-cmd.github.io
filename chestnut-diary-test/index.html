<style>

const S=window.STORY, $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

let AC;function tone(f1,f2,d,type='sine',vol=.18,delay=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={pop:()=>tone(520,180,.12,'triangle',.25),happy:()=>{tone(660,660,.12,'sine',.15);tone(880,880,.18,'sine',.15,.1)},startled:()=>tone(400,1200,.15,'square',.07),
confused:()=>{tone(500,380,.18,'sine',.14);tone(420,330,.22,'sine',.12,.16)},nervous:()=>tone(300,260,.25,'triangle',.12),wave:()=>tone(700,900,.15,'sine',.12),neutral:()=>{},
levelup:()=>{tone(660,660,.1,'sine',.13);tone(880,880,.1,'sine',.13,.09);tone(1175,1175,.18,'sine',.13,.18)},
flip:()=>{try{AC=AC||new AudioContext();const b=AC.createBuffer(1,AC.sampleRate*.25,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=1800;g.gain.value=.25;s.buffer=b;s.connect(f).connect(g).connect(AC.destination);s.start()}catch(e){}}};
// ---------- word cards ----------
const gkey=w=>w.toLowerCase().replace(/[.!?…]+$/,'').replace(/^i feel that$/,'feel that').trim();
function wordCard(w,ev){ev&&ev.stopPropagation();const g=(window.GLOSS||{})[gkey(w)];if(!g)return;$$('.wcard').forEach(x=>x.remove());SFX.pop();
  const c=document.createElement('div');c.className='wcard';c.innerHTML=`<button class="x">×</button><div class="w">${w.replace(/[.!?]+$/,'')}</div><div class="m">${g[0]}</div>${g[1]?`<div class="r"><i>例句</i>${g[1]}</div>`:''}<div class="r"><i>什么时候说</i>${g[2]}</div>`;
  document.body.appendChild(c);c.querySelector('.x').onclick=()=>c.remove();setTimeout(()=>document.addEventListener('pointerdown',function f(e){if(!c.contains(e.target)){c.remove();document.removeEventListener('pointerdown',f,true)}},true),50)}
document.addEventListener('click',e=>{const k=e.target.closest('.k');if(k&&!e.target.closest('.ghost'))wordCard(k.textContent,e)},true);
const md=t=>(t||'').replace(/\*\*(.+?)\*\*/g,'<b class="k">$1</b>');
const plain=t=>(t||'').replace(/\*\*/g,'').trim();
const zh=t=>S.ZH[t]||'';
function tapHear(el){let t=null;el.addEventListener('click',()=>{if(t){clearTimeout(t);t=null;el.classList.toggle('showzh');return}t=setTimeout(()=>{t=null},260)})}
function speak(){return}
// ---------- state ----------
const ENDS=S.ENDINGS, NAME=Object.fromEntries(S.PEOPLE.map(p=>[p.id,p.name])), CARD=Object.fromEntries(S.CARDS.map(c=>[c.id,c]));
let got=new Set(JSON.parse(localStorage.getItem('cd_l1b')||'[]'));
let P=[{},{},{}], ST=[S.newState()], busy=false, firstTime=!localStorage.getItem('cd_seen');
const img=(id,st)=>`assets/${id}_${st}.png`;
const hearts=l=>'♥'.repeat(l)+'♡'.repeat(2-l);
const active=()=>P.findIndex(p=>!p.res);
const BGPOS=['15% 40%','50% 40%','85% 40%'];
// ---------- render play page ----------
function topbar(title){return `<div class="top"><span class="dot"></span><h1>${title}<small>Chestnut's Diary · Day 1</small></h1><div class="icons"><button id="backBtn" title="Start over · 重来">↺</button></div></div>`}
function renderPlay(){busy=false;
  $('#page').innerHTML=topbar(S.TITLE)+`<div class="strip" id="strip">${[0,1,2].map(k=>`<div class="cp" data-k="${k}"></div>`).join('')}</div>
   <div class="rows"><div class="row" id="prow"><span class="ri">👤</span></div><div class="row" id="crow"><span class="ri">💬</span></div></div>`;
  $('#backBtn').onclick=()=>{if(!busy)resetFrom(0)};
  S.PEOPLE.forEach(p=>{const d=document.createElement('div');d.className='sticker person';d.dataset.id=p.id;
    d.innerHTML=`<div class="t"><img src="${img(p.id,'neutral')}" alt=""></div><div class="nm">${p.name}<span class="h"></span><span class="lv"></span></div>`;
    enableDrag(d,'who',p.id);$('#prow').appendChild(d)});
  S.CARDS.forEach(c=>{const d=document.createElement('div');d.className='sticker '+(c.kind==='prop'?'pr':'line');d.dataset.id=c.id;
    d.innerHTML=c.kind==='prop'?`<div class="t">${c.icon}</div><div class="lbl"><div class="zh">${c.zh}</div></div>`:`<div class="s">${md(c.say)}<div class="zh">${zh(c.say)}</div></div>`;
    enableDrag(d,'card',c.id);$('#crow').appendChild(d)});
  [0,1,2].forEach(drawPanel);trayHearts(ST[ST.length-1]);
  if(firstTime)setTimeout(demoHand,600)}
function trayHearts(s,pulse=[]){S.PEOPLE.forEach(p=>{const el=$(`#prow [data-id="${p.id}"]`);if(!el)return;const l=s.rel[p.id];el.querySelector('.h').textContent=hearts(l);el.querySelector('.lv').textContent=S.LEVELS[l].en;
  if(pulse.includes(p.id)){el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse')}})}
function drawPanel(k){const el=$(`.cp[data-k="${k}"]`),p=P[k],a=active();
  el.className='cp'+(k===a?' active':(a>=0&&k>a?' locked':''));
  el.innerHTML=`<img class="bg" src="assets/classroom.png" alt="" style="object-position:${BGPOS[k]}"><span class="num">${k+1}</span>
   <div class="ch me"><img src="${img('chestnut',p.res?p.meMood:'neutral')}" alt="Chestnut"></div>`;
  if(p.who){el.insertAdjacentHTML('beforeend',`<div class="ch you" data-id="${p.who}"><img src="${img(p.who,p.res?p.mood:'neutral')}" alt="${p.who}"></div>`)}else el.insertAdjacentHTML('beforeend',`<div class="ws">👤</div>`);
  if(p.card)meBubble(el,p.card,false);else el.insertAdjacentHTML('beforeend',`<div class="cs">💬</div>`);
  if(p.res)p.res.out.forEach(o=>showOut(el,p,o,false)),showBadges(el,k,false);
  if((p.who||p.card)&&!busy){const b=document.createElement('button');b.className='redo';b.title='Redo this panel · 重摆这一格';b.textContent='↺';b.onclick=e=>{e.stopPropagation();if(!busy)resetFrom(k)};el.appendChild(b)}}
function meBubble(el,cid,anim=true){const c=CARD[cid],b=document.createElement('div');
  if(c.kind==='prop'){b.className='pb me emoji';b.textContent=c.icon}else{b.className='pb me';b.innerHTML=md(c.say)+`<div class="zh">${zh(c.say)}</div>`;tapHear(b)}
  if(!anim)b.style.animation='none';el.appendChild(b)}
function showOut(el,p,o,anim=true){
  if(o.who===p.who){const ci=el.querySelector('.ch.you');if(ci){ci.querySelector('img').src=img(o.who,o.mood);if(anim){ci.classList.remove('hop');void ci.offsetWidth;ci.classList.add('hop');(SFX[o.mood]||SFX.neutral)()}}}
  if(o.act){let cap=el.querySelector('.cap');if(!cap){cap=document.createElement('div');cap.className='cap';el.appendChild(cap)}cap.textContent=cap.textContent?cap.textContent+' · '+o.act:o.act;if(!anim)cap.style.animation='none'}
  if(o.en){const b=document.createElement('div');b.className='pb they'+(o.note?' note':'');b.innerHTML=md(o.en)+`<div class="zh">${zh(o.en)}</div>`;tapHear(b);if(!anim)b.style.animation='none';el.appendChild(b)}
  if(o.prop){const d=document.createElement('div');d.className='pp';d.innerHTML=o.prop.startsWith('img:')?`<div class="pic"><img src="${o.prop.slice(4)}"></div>`:o.prop;if(!anim)d.style.animation='none';el.appendChild(d);anim&&SFX.pop()}}
function showBadges(el,k,anim=true){const before=ST[k].rel,after=ST[k+1].rel,who=P[k].who;const box=document.createElement('div');box.className='badges';
  const list=[who,...S.PEOPLE.map(p=>p.id).filter(x=>x!==who&&after[x]!==before[x])];
  box.innerHTML=list.map(w=>`<span class="badge ${after[w]>before[w]?'up':''}">${w!==who?NAME[w]+' ':''}<span class="h">${hearts(after[w])}</span> ${S.LEVELS[after[w]].en}${after[w]>before[w]?' ↑':''}</span>`).join('');
  if(!anim)box.querySelectorAll('.badge').forEach(b=>b.style.animation='none');el.appendChild(box);return list.filter(w=>after[w]>before[w])}
// ---------- placing ----------
function fill(kind,id){const k=active();if(k<0||busy)return;const p=P[k];p[kind]=id;SFX.pop();stopHand();
  const el=$(`.cp[data-k="${k}"]`);
  if(kind==='who'){el.querySelector('.ws')?.remove();el.querySelector('.ch.you')?.remove();el.insertAdjacentHTML('beforeend',`<div class="ch you landed" data-id="${id}"><img src="${img(id,'neutral')}" alt="${id}"></div>`)}
  else{el.querySelector('.cs')?.remove();el.querySelector('.pb.me')?.remove();meBubble(el,id)}
  if(p.who&&p.card)play(k);else drawRedo(el,k)}
function drawRedo(el,k){if(el.querySelector('.redo'))return;const b=document.createElement('button');b.className='redo';b.textContent='↺';b.title='Redo this panel · 重摆这一格';b.onclick=e=>{e.stopPropagation();if(!busy)resetFrom(k)};el.appendChild(b)}
function play(k){busy=true;const p=P[k],el=$(`.cp[data-k="${k}"]`);el.querySelector('.redo')?.remove();
  const r=S.resolve(ST[k],p.who,p.card);ST[k+1]=r.state;ST.length=k+2;
  const before=ST[k].rel,after=r.state.rel,ups=S.PEOPLE.map(x=>x.id).filter(w=>after[w]>before[w]);
  p.res=r;p.mood=(r.out.find(o=>o.who===p.who)||{}).mood||'neutral';p.meMood=ups.length?'happy':'confused';
  let t=650;r.out.forEach(o=>{setTimeout(()=>showOut(el,p,o),t);t+=o.en?1000:700});
  setTimeout(()=>{const ch=el.querySelector('.ch.me img');ch.src=img('chestnut',p.meMood);showBadges(el,k);trayHearts(r.state,ups);ups.length?SFX.levelup():SFX.confused()},t);
  setTimeout(()=>{busy=false;drawRedo(el,k);const a=active();[0,1,2].forEach(j=>{const c=$(`.cp[data-k="${j}"]`);c.classList.toggle('active',j===a);c.classList.toggle('locked',a>=0&&j>a)});if(a<0)showNext()},t+500)}
function resetFrom(k){for(let j=k;j<3;j++)P[j]={};ST.length=k+1;$('#nextBtn')?.remove();[0,1,2].forEach(j=>{if(j>=k)drawPanel(j);else{const c=$(`.cp[data-k="${j}"]`);c.classList.remove('active','locked')}});
  $(`.cp[data-k="${k}"]`).classList.add('active');trayHearts(ST[k]);SFX.flip()}
function showNext(){if($('#nextBtn'))return;const nb=document.createElement('button');nb.id='nextBtn';nb.innerHTML='Next<span>→</span>';nb.onclick=e=>{e.stopPropagation();nb.remove();flipTo(renderEnd)};$('#page').appendChild(nb)}
function flipTo(fn){const pg=$('#page');SFX.flip();pg.classList.add('flip-out');setTimeout(()=>{pg.classList.remove('flip-out');fn();pg.classList.add('flip-in');setTimeout(()=>pg.classList.remove('flip-in'),520)},480)}
// ---------- drag ----------
function enableDrag(el,kind,id){let g=null,sx,sy,moved=false;
  el.addEventListener('pointerdown',e=>{if(busy)return;stopHand();const kEl=e.target.closest&&e.target.closest('.k');sx=e.clientX;sy=e.clientY;moved=false;el.setPointerCapture(e.pointerId);
    const target=()=>{const k=active();return k<0?null:$(`.cp[data-k="${k}"]`)};
    const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){moved=true;g=el.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);el.style.opacity=.25}
      if(moved){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';const t=target();$$('.cp').forEach(c=>c.classList.remove('hot'));if(t){const r=t.getBoundingClientRect();if(ev.clientX>r.left-20&&ev.clientX<r.right+20&&ev.clientY>r.top-20&&ev.clientY<r.bottom+30)t.classList.add('hot')}}};
    const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);const hot=!!$('.cp.hot');$$('.cp').forEach(c=>c.classList.remove('hot'));
      if(g){g.remove();g=null}el.style.opacity='';if(hot&&moved)fill(kind,id);else if(!moved){const n=Date.now();if(n-(el._lt||0)<320){clearTimeout(el._st);el.classList.toggle('showzh');el._lt=0}else{el._lt=n;el._st=setTimeout(()=>{if(kEl)wordCard(kEl.textContent)},300)}}};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)})}
// ---------- ending ----------
function renderEnd(){const s=ST[3],id=S.ending(s),E=ENDS.find(e=>e.id===id);got.add(id);localStorage.setItem('cd_l1b',JSON.stringify([...got]));busy=false;
  const you=P.map(p=>p.card),they=[],texts=[];
  P.forEach(p=>{const c=CARD[p.card];if(c.say)texts.push(c.say);p.res.out.forEach(o=>{if(o.en){they.push([o.en,o.who]);texts.push(o.en)}})});
  const words=[...new Set(texts.flatMap(t=>(t.match(/\*\*(.+?)\*\*/g)||[]).map(m=>m.slice(2,-2))))];
  const esc=s=>s.replace(/"/g,'&quot;');
  const ph=(en,who,tag)=>`<button class="ph" data-who="${who}">${tag?`<i class="they">${tag}</i> `:''}${md(en)}<span class="zh">${zh(en)}</span></button>`;
  const mood=w=>w==='chestnut'?(E.soft?'nervous':'happy'):(id==='E6'&&w==='benny'?'nervous':['neutral','happy','wave'][s.rel[w]]);
  $('#page').innerHTML=`<div class="top"><span class="dot full"></span><h1>${S.TITLE}<small>Chestnut's Diary · Day 1</small></h1><div class="icons"><button id="backBtn" title="Try again · 再试一次">↺</button></div></div><div class="end">
   <div class="crew">${['chestnut','pia','ollie','benny'].map(w=>`<img src="${img(w,mood(w))}" alt="${w}">`).join('')}</div>
   <div class="stamp">${E.zh}</div>
   <div class="relrow">${S.PEOPLE.map(p=>`<span>${p.name} <b class="h">${hearts(s.rel[p.id])}</b> ${S.LEVELS[s.rel[p.id]].en}</span>`).join('')}</div>
   <div class="sum">
    <div class="col"><div class="lt">You said · 你说了</div>${you.map((c,i)=>{const C=CARD[c];return C.say?ph(C.say,'chestnut',String(i+1)):`<button class="ph"><i class="they">${i+1}</i> <span style="display:inline;margin:0;font-size:20px">${C.icon}</span><span class="zh">${C.zh}</span></button>`}).join('')}
     <div class="lt">They said · 他们说了</div>${they.length?they.map(([en,w])=>ph(en,w,NAME[w])).join(''):'<div class="none">—</div>'}</div>
    <div class="col"><div class="lt">Words to steal · 地道表达</div><div class="vg">${words.map(w=>{const g=window.GLOSS[gkey(w)];return `<button class="vw" data-en="${esc(w)}"><b class="k">${w.replace(/[.!?]+$/,'')}</b><span>${g?g[0]:''}</span></button>`}).join('')}</div></div>
   </div>
   <div class="lt">Endings · 结局 ${got.size} / ${ENDS.length}</div>
   <div class="egrid">${ENDS.map(e=>`<div class="ec ${got.has(e.id)?'got':''} ${e.id===id?'now':''}">${got.has(e.id)?e.zh:'?'}</div>`).join('')}</div>
   <div class="endbtns"><button id="retry">↺ Try again · 再试一次</button></div></div>`;
  $$('.ph').forEach(b=>tapHear(b));
  SFX[E.soft?'nervous':'happy']();
  const again=()=>{P=[{},{},{}];ST=[S.newState()];flipTo(renderPlay)};$('#retry').onclick=again;$('#backBtn').onclick=again}
// ---------- first-time demo hand ----------
let handT=[],handEl=null;
function demoHand(){const st=$('.sticker.person'),sl=$('.cp.active .ws');if(!st||!sl)return;handEl=document.createElement('div');handEl.className='hand';handEl.textContent='👆';document.body.appendChild(handEl);
  const a=st.getBoundingClientRect(),b=sl.getBoundingClientRect();let n=0;
  const loop=()=>{if(!handEl)return;handEl.style.transition='none';handEl.style.left=(a.left+a.width/2-10)+'px';handEl.style.top=(a.top+a.height/2)+'px';handEl.style.opacity=.75;
    handT.push(setTimeout(()=>{if(!handEl)return;handEl.style.transition='all 1.1s ease-in-out';handEl.style.left=(b.left+b.width/2-10)+'px';handEl.style.top=(b.top+b.height/2)+'px'},300));
    handT.push(setTimeout(()=>{if(++n<2)loop();else stopHand()},1900))};loop()}
function stopHand(){if(handEl){handEl.remove();handEl=null;handT.forEach(clearTimeout)}if(firstTime){localStorage.setItem('cd_seen','1');firstTime=false}}
if(new URLSearchParams(location.search).has('reset')){localStorage.removeItem('cd_l1b');localStorage.removeItem('cd_seen');got=new Set();firstTime=true}
renderPlay();
</script></body></html>
