<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chestnut's Diary · Level 1</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--cover:#F6A96B;--cover-edge:#E8775A;--paper:#FFFBF1;--paper-edge:#F3E7CF;--ink:#3B2A22;--rose:#E06A4E;--line:#9CCBEA;--gold:#F4B73E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#FCEBD6;font-family:Nunito,system-ui,sans-serif;color:var(--ink);overflow:hidden;user-select:none}
#stage{position:fixed;inset:0;display:grid;place-items:center}
.book{position:relative;width:min(96vw,1120px);aspect-ratio:16/10.4;max-height:96vh;background:var(--cover);border-radius:18px;padding:18px;box-shadow:0 14px 30px rgba(150,80,30,.25), inset 0 0 0 4px var(--cover-edge)}
.book::before,.book::after{content:"";position:absolute;width:34px;height:34px;background:#FFD98A;border:3px solid var(--cover-edge)}
.book::before{top:-3px;left:-3px;border-radius:16px 0 14px 0}.book::after{bottom:-3px;right:-3px;border-radius:14px 0 16px 0}
.ribbon{position:absolute;top:0;left:56px;width:22px;height:84px;background:#EF5D5D;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);z-index:5}
.page{position:absolute;inset:18px;background:var(--paper);border-radius:8px;box-shadow:inset 0 0 40px var(--paper-edge);display:flex;flex-direction:column;padding:18px 34px 14px;overflow:hidden;transform-origin:left center}
.page.flip-out{animation:flipOut .5s ease-in forwards}.page.flip-in{animation:flipIn .5s ease-out}
@keyframes flipOut{to{transform:perspective(1600px) rotateY(-75deg);opacity:0}}
@keyframes flipIn{from{transform:perspective(1600px) rotateY(60deg);opacity:0}to{transform:none;opacity:1}}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.dot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--rose);flex:none}.dot.full{background:var(--rose)}
h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(18px,2.3vw,28px);color:var(--rose);margin:0;flex:1}
h1 small{display:block;font-family:Nunito;font-size:.5em;color:#B08A78;font-weight:600}
.icons{display:flex;gap:8px}.icons button{width:38px;height:38px;border-radius:50%;border:2px solid #E7D3B5;background:#fff;font:800 15px Nunito;color:#8A6A58;cursor:pointer}
.icons button.on{background:#FFE7A8;border-color:var(--gold);color:var(--ink)}
.panel{position:relative;flex:1;margin:10px 0;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.panel .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;pointer-events:none}
.char{position:absolute;bottom:1%;width:clamp(130px,19vw,235px);transform:translateX(-50%);transition:transform .2s}
.char img{width:100%;display:block;pointer-events:none}
.char.big{width:clamp(160px,25vw,300px)}
.char.hop{animation:hop .35s ease}@keyframes hop{40%{transform:translateX(-50%) translateY(-14px)}}
.bubble{position:absolute;max-width:min(320px,34%);background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 14px;font-size:clamp(13px,1.45vw,17px);font-weight:800;line-height:1.3;transform:translate(-50%,-100%) scale(.6);opacity:0;transition:all .25s cubic-bezier(.3,1.6,.5,1);cursor:pointer;z-index:3}
.bubble.show{transform:translate(-50%,-100%) scale(1);opacity:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble .zh{display:none;font-weight:600;font-size:.82em;color:#8A6A58;margin-top:3px}

.bubble.note{background:#FFF6B8;border-radius:4px;transform:translate(-50%,-100%) rotate(-3deg) scale(.6)}.bubble.note.show{transform:translate(-50%,-100%) rotate(-3deg) scale(1)}
.slot{position:absolute;width:min(300px,30%);min-height:70px;transform:translate(-50%,-100%);border:3px dashed #D8C3A3;border-radius:18px;background:#F7EEDD;display:grid;place-items:center;color:#CDB89A;font:800 26px Nunito;animation:breathe 1.6s ease-in-out infinite;z-index:2}
.slot.hot{border-color:var(--gold);background:#FFF1C9;box-shadow:0 0 0 6px rgba(244,183,62,.3);animation:none}
@keyframes breathe{50%{box-shadow:0 0 0 7px rgba(216,195,163,.35)}}
.slot.filled{animation:none;border:none;background:none}
.slot.to{width:58px;min-height:58px;height:58px;border-radius:50%;font-size:22px;transform:translate(-50%,-50%)}
.slot.to.hot{transform:translate(-50%,-50%) scale(1.25)}
.tray{display:flex;justify-content:center;gap:14px;min-height:96px;align-items:flex-start}
.sticker{cursor:grab;touch-action:none;transition:transform .15s,opacity .2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.sticker:hover{transform:translateY(-3px) rotate(-2deg)}
.sticker .t{width:84px;height:76px;border:3px solid var(--ink);border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #fff,0 3px 8px rgba(0,0,0,.12)}.sticker .t img{max-width:68%;max-height:72%;pointer-events:none}
.sticker .lbl{font-size:13px;font-weight:800;color:var(--ink);text-align:center}.sticker .lbl .zh{display:none;font-weight:600}

.sticker .s{max-width:220px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:9px 12px;font-size:14px;font-weight:800;box-shadow:0 0 0 5px #fff,0 3px 8px rgba(0,0,0,.12)}
.sticker .s .zh{display:none;font-weight:600;font-size:.85em;color:#8A6A58}
.sticker.used{opacity:0;pointer-events:none}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.08) rotate(-4deg);filter:drop-shadow(0 10px 10px rgba(0,0,0,.22))}
.landed{animation:squash .35s ease}@keyframes squash{30%{transform:scale(1.15,.82)}65%{transform:scale(.95,1.06)}}
.burst{position:absolute;pointer-events:none;z-index:4}
.burst i{position:absolute;width:4px;height:14px;background:var(--gold);border-radius:3px;animation:ray .45s ease-out forwards}
@keyframes ray{from{opacity:1;transform:rotate(var(--r)) translateY(-10px)}to{opacity:0;transform:rotate(var(--r)) translateY(-38px)}}
.hand{position:fixed;z-index:60;font-size:44px;opacity:.75;pointer-events:none;transition:all 1s ease-in-out}
/* ending */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.end .crew{display:flex;align-items:flex-end;gap:6px}.end .crew img{width:clamp(110px,13vw,170px)}
.stamp{font-family:Fraunces,serif;font-style:italic;font-size:clamp(22px,3vw,36px);color:var(--rose);border:3px double var(--rose);padding:6px 22px;border-radius:10px;transform:rotate(-2deg);animation:stampIn .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampIn{from{transform:scale(1.6) rotate(-8deg);opacity:0}}
.end .zh{display:none;color:#8A6A58;font-weight:700}
.end .theend{font-family:Fraunces,serif;color:#B08A78;letter-spacing:.2em;font-size:13px}
.phr{font-size:14px;color:#6B5444;max-width:560px}.phr b{color:var(--ink)}
.coll{display:flex;gap:5px;margin-top:4px}.coll span{width:13px;height:13px;border-radius:50%;border:2px solid #E7C9B5}.coll span.got{background:var(--gold);border-color:var(--gold)}
.endbtns{display:flex;gap:12px;margin-top:6px}.endbtns button{border:2px solid #CDB89A;background:#fff;border-radius:999px;padding:8px 18px;font:800 14px Nunito;color:var(--ink);cursor:pointer}
.learn{margin:6px auto 2px;max-width:560px;display:flex;flex-direction:column;gap:6px}
.learn .lt{font:700 12px Nunito;letter-spacing:.08em;text-transform:uppercase;color:#C0795A;text-align:center}
.ph{display:block;text-align:left;background:#fff;border:2px solid #E9D8C4;border-radius:14px;padding:7px 14px;font:600 14px Nunito;color:#3B2A22;cursor:pointer}
.ph b{display:inline}.ph .they{font-style:normal;font-size:11px;font-weight:800;color:#C0795A;background:#FFF1C9;border-radius:6px;padding:1px 6px;margin-right:4px}.ph span{display:block;font-size:12px;color:#8A6A58;margin-left:24px}
.ph:hover{border-color:#F2B84B}
.lbl{font-size:11px}
.showzh .zh,.showzh.zh{display:block!important}
.ph .zh{display:none}
.zhhint{font:600 11px Nunito;color:#B08A78;text-align:center;margin-top:-4px}
.prop{position:absolute;z-index:4;font-size:40px;transform:translate(-50%,-50%);animation:propIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes propIn{from{transform:translate(-50%,10%) scale(.2);opacity:0}}
.prop .pic{width:110px;background:#fff;border:3px solid var(--ink);border-radius:6px;padding:6px;transform:rotate(-6deg);box-shadow:0 4px 10px rgba(0,0,0,.15)}.prop .pic img{width:100%;display:block}
.k{color:#E0473C;font-weight:900}
.end{overflow-y:auto;justify-content:flex-start;padding:6px 4px 10px}
.end .crew img{width:clamp(80px,9vw,120px)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:880px;text-align:left}
.sum .col{display:flex;flex-direction:column;gap:6px}.sum .lt,.end > .lt{font:800 12px Nunito;letter-spacing:.08em;text-transform:uppercase;color:#C0795A;margin-top:4px}
.ph .zh{display:none;font-size:12px;color:#8A6A58;margin-left:24px}.ph.showzh .zh{display:block}
.none{font-size:13px;color:#8A6A58}
.vg{background:#fff;border:2px solid #E9D8C4;border-radius:14px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px}
.vg .when{width:100%;font-size:12px;font-weight:800;color:#8A6A58}
.vw{border:1.5px solid #F1D9C9;background:#FFF8F1;border-radius:10px;padding:4px 9px;cursor:pointer;font:600 13px Nunito;color:#3B2A22;display:flex;flex-direction:column;align-items:flex-start}
.vw span{font-size:11px;color:#8A6A58}.vw:hover{border-color:#F2B84B}
.egrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;max-width:880px}
.ec{border:2px dashed #E7C9B5;border-radius:10px;padding:6px;font-size:11px;font-weight:700;color:#C9AE9C;min-height:40px;display:grid;place-items:center;text-align:center}
.ec.got{border:2px solid var(--gold);background:#FFF6DA;color:var(--ink)}.ec.now{box-shadow:0 0 0 3px var(--rose)}
.sticker .lbl{max-width:150px}
@media(max-width:820px){.sum{grid-template-columns:1fr}.egrid{grid-template-columns:repeat(3,1fr)}}
.k{cursor:pointer;text-decoration:underline dotted 2px;text-underline-offset:3px}
.wcard{position:fixed;left:50%;top:50%;z-index:80;width:min(340px,88vw);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 18px 14px;box-shadow:0 0 0 6px #fff,0 14px 34px rgba(0,0,0,.25);transform:translate(-50%,-50%);animation:cardIn .35s cubic-bezier(.3,1.6,.5,1);text-align:left}
@keyframes cardIn{from{transform:translate(-50%,-30%) scale(.6) rotate(-6deg);opacity:0}}
.wcard .w{font:900 24px Nunito;color:#E0473C}.wcard .m{font-weight:800;font-size:16px;margin:4px 0 10px;color:var(--ink)}
.wcard .r{font-size:14px;color:#3B2A22;margin-top:6px}.wcard .r i{display:block;font-style:normal;font-size:11px;font-weight:800;color:#C0795A;letter-spacing:.06em}
.wcard .x{position:absolute;right:10px;top:6px;border:none;background:none;font-size:22px;cursor:pointer;color:#B08A78}
#rotate{display:none;position:fixed;inset:0;z-index:99;background:#FCEBD6;place-items:center;text-align:center;font:800 18px Nunito;color:#8A6A58;padding:30px}
@media (orientation:portrait) and (max-width:700px){.showzh .zh,.showzh.zh{display:block!important}
.ph .zh{display:none}
.zhhint{font:600 11px Nunito;color:#B08A78;text-align:center;margin-top:-4px}
.prop{position:absolute;z-index:4;font-size:40px;transform:translate(-50%,-50%);animation:propIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes propIn{from{transform:translate(-50%,10%) scale(.2);opacity:0}}
.prop .pic{width:110px;background:#fff;border:3px solid var(--ink);border-radius:6px;padding:6px;transform:rotate(-6deg);box-shadow:0 4px 10px rgba(0,0,0,.15)}.prop .pic img{width:100%;display:block}
#rotate{display:grid}}
</style></head>
<body>
<div id="rotate"><div><div style="font-size:54px">📱↻</div>Turn your phone sideways to read the diary.<br><span style="font-weight:600">请把手机横过来</span></div></div><div id="stage"><div class="book"><div class="ribbon"></div><div class="page" id="page"></div></div></div>
<script src="story.js"></script><script src="gloss.js"></script>
<script>
const S=window.STORY, $=s=>document.querySelector(s);
const BG={classroom:'<img class="bg" src="assets/classroom.png" alt="">',hallway:'<img class="bg" src="assets/hallway.png" alt="">'};
// ---------- sound (WebAudio, only after a tap) ----------
let AC;function tone(f1,f2,d,type='sine',vol=.18,delay=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={pop:()=>tone(520,180,.12,'triangle',.25),happy:()=>{tone(660,660,.12,'sine',.15);tone(880,880,.18,'sine',.15,.1)},startled:()=>tone(400,1200,.15,'square',.07),
confused:()=>{tone(500,380,.18,'sine',.14);tone(420,330,.22,'sine',.12,.16)},nervous:()=>tone(300,260,.25,'triangle',.12),wave:()=>tone(700,900,.15,'sine',.12),neutral:()=>{},
flip:()=>{try{AC=AC||new AudioContext();const b=AC.createBuffer(1,AC.sampleRate*.25,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=1800;g.gain.value=.25;s.buffer=b;s.connect(f).connect(g).connect(AC.destination);s.start()}catch(e){}}};
const gkey=w=>w.toLowerCase().replace(/[.!?…]+$/,'').replace(/^i feel that$/,'feel that').trim();
function wordCard(w,ev){ev&&ev.stopPropagation();const g=(window.GLOSS||{})[gkey(w)];if(!g)return;document.querySelectorAll('.wcard').forEach(x=>x.remove());SFX.pop();
  const c=document.createElement('div');c.className='wcard';c.innerHTML=`<button class="x">×</button><div class="w">${w}</div><div class="m">${g[0]}</div><div class="r"><i>例句</i>${g[1]}</div><div class="r"><i>什么时候说</i>${g[2]}</div>`;
  document.body.appendChild(c);c.querySelector('.x').onclick=()=>c.remove();setTimeout(()=>document.addEventListener('pointerdown',function f(e){if(!c.contains(e.target)){c.remove();document.removeEventListener('pointerdown',f,true)}},true),50)}
document.addEventListener('click',e=>{const k=e.target.closest('.k');if(k&&!e.target.closest('.ghost'))wordCard(k.textContent,e)},true);
const md=t=>(t||'').replace(/\*\*(.+?)\*\*/g,'<b class="k">$1</b>');
const plain=t=>(t||'').replace(/\*\*/g,'').replace(/^\(note\)\s*/,'').trim();
let curAudio=null;
function tapHear(el,en,who){let t=null;el.addEventListener('click',()=>{if(t){clearTimeout(t);t=null;el.classList.toggle('showzh');return}t=setTimeout(()=>{t=null;speak(en,who)},260)})}
function speak(t,who){return;const p=plain(t);if(!p||p==='…')return;const V=window.VOICE||{};let f=V[(who||'')+'|'+p];if(!f){const k=Object.keys(V).find(k=>k.slice(k.indexOf('|')+1)===p);f=k&&V[k]}
  if(curAudio){curAudio.pause();curAudio=null}if(window.speechSynthesis)speechSynthesis.cancel();
  if(f){curAudio=new Audio('voice/'+f);curAudio.play().catch(()=>{});return}speakTTS(p)}
function speakTTS(t){if(!t||t==='…'||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[\u{1F300}-\u{1FAFF}]/gu,''));u.lang='en-US';u.rate=.95;speechSynthesis.speak(u)}
// ---------- state ----------
const ALL=Object.keys(S.endings);let got=new Set(JSON.parse(localStorage.getItem('cd_l1')||'[]'));
let curLine=null,heard=null,hist=[],path=[],busy=false,firstTime=!localStorage.getItem('cd_seen');
const img=(id,st)=>`assets/${id}_${st}.png`;
function charPos(el){const p=$('#panel').getBoundingClientRect(),r=el.getBoundingClientRect();return{x:(r.left+r.width/2-p.left)/p.width*100,top:(r.top-p.top)/p.height*100}}
function showBubble(who,en,zh,opt={}){const panel=$('#panel'),c=panel.querySelector(`[data-id="${who}"]`);if(!c||!en)return;
  const old=[...panel.querySelectorAll('.bubble')];if(old.length>=2)old[0].remove();
  const pos=charPos(c),b=document.createElement('div');b.className='bubble'+(opt.note?' note':'');b.style.left=Math.min(84,Math.max(16,pos.x))+'%';b.style.top=(pos.top+4)+'%';
  b.innerHTML=`${md(en)}${zh?`<div class="zh">${zh}</div>`:''}`;tapHear(b,en,who);panel.appendChild(b);requestAnimationFrame(()=>{b.classList.add('show');setTimeout(()=>{const o=[...panel.querySelectorAll('.bubble')].filter(x=>x!==b);o.forEach(x=>{const r1=x.getBoundingClientRect(),r2=b.getBoundingClientRect();if(r1.right>r2.left-6&&r1.left<r2.right+6&&r1.bottom>r2.top-6&&r1.top<r2.bottom+6){const pr=panel.getBoundingClientRect();x.style.top=Math.max(r1.height/pr.height*100+1,(r2.top-pr.top-8)/pr.height*100)+'%'}})},260)})}
function setState(who,st){const c=$(`#panel [data-id="${who}"]`);if(!c)return;c.querySelector('img').src=img(who,st);c.classList.remove('hop');void c.offsetWidth;c.classList.add('hop');(SFX[st]||SFX.neutral)()}
// ---------- render ----------
function go(id,push=true,anim=true){const pg=$('#page');if(push&&window.cur)hist.push(window.cur);window.cur=id;
  const draw=()=>{pg.classList.remove('flip-out');S.endings[id]?renderEnd(id):renderPage(id);if(anim){pg.classList.add('flip-in');setTimeout(()=>pg.classList.remove('flip-in'),520)}};
  if(anim&&pg.innerHTML){SFX.flip();pg.classList.add('flip-out');setTimeout(draw,480)}else draw()}
function topbar(title,done){return `<div class="top"><span class="dot ${done?'full':''}"></span><h1>${title}<small>Chestnut's Diary · Day 1</small></h1>
<div class="icons"><button id="backBtn" title="Back">↺</button></div></div>`}
function wireTop(){$('#backBtn').onclick=()=>{if(busy)return;const prev=hist.pop();if(prev){path.pop();heard=null;go(prev,false)}}}
function renderPage(id){const P=S.pages[id];busy=false;
  $('#page').innerHTML=topbar(P.title)+`<div class="panel" id="panel">${BG[P.bg]}</div><div class="tray" id="tray"></div>`;wireTop();
  const panel=$('#panel');
  P.chars.forEach(([cid,x,st])=>{const d=document.createElement('div');d.className='char';d.dataset.id=cid;d.style.left=x+'%';d.innerHTML=`<img src="${img(cid,st)}" alt="${cid}">`;panel.appendChild(d)});
  setTimeout(()=>{P.intro.forEach(([w,en,zh],i)=>setTimeout(()=>showBubble(w,en,zh,{note:en.startsWith('(note)')}),i*600));
    if(P.targets){P.targets.forEach((t,k)=>{const c=panel.querySelector(`[data-id="${t}"]`);if(!c)return;const pos=charPos(c);const sl=document.createElement('div');sl.className='slot to';if(!k)sl.id='slot';sl.dataset.to=t;sl.textContent='?';sl.style.left=pos.x+'%';sl.style.top=(pos.top+3)+'%';panel.appendChild(sl)})}else{const c=panel.querySelector(`[data-id="${P.slot}"]`),pos=charPos(c);const sl=document.createElement('div');sl.className='slot';sl.id='slot';sl.textContent='?';sl.style.left=pos.x+'%';sl.style.top=(pos.top+2)+'%';panel.appendChild(sl);}
    if(id===S.start&&firstTime)demoHand()},380);
  const tray=$('#tray');P.stickers.forEach((s,i)=>{const d=document.createElement('div');d.className='sticker';
    d.innerHTML=s.kind==='topic'?`<div class="t"><img src="assets/icon_${({'🎵':'music','🎮':'games','🎨':'drawing','🥟':'food','…':'silence'})[s.icon]}.png" alt=""></div><div class="lbl">${s.say[0]==='…'?'(say nothing)':md(s.say[0])}<div class="zh">${s.say[1]||'（不说话）'}</div></div>`:`<div class="s">${md(s.say[0])}${s.say[1]&&s.say[0]!=='…'?`<div class="zh">${s.say[1]}</div>`:''}</div>`;
    d.dataset.en=s.say[0]==='…'?'':s.say[0];enableDrag(d,to=>place(id,i,d,to));tray.appendChild(d)})}
function enableDrag(el,onDrop){let g=null,sx,sy,moved=false;
  el.addEventListener('pointerdown',e=>{if(busy)return;stopHand();sx=e.clientX;sy=e.clientY;moved=false;el.setPointerCapture(e.pointerId);
    const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){moved=true;g=el.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);el.style.opacity=.25}
      if(moved){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';let best=null,bd=1e9;document.querySelectorAll('.slot:not(.filled)').forEach(s=>{const r=s.getBoundingClientRect();s.classList.remove('hot');if(ev.clientX>r.left-40&&ev.clientX<r.right+40&&ev.clientY>r.top-40&&ev.clientY<r.bottom+40){const d=Math.hypot(ev.clientX-(r.left+r.width/2),ev.clientY-(r.top+r.height/2));if(d<bd){bd=d;best=s}}});best&&best.classList.add('hot')}};
    const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);const hs=document.querySelector('.slot.hot'),hot=!!hs,to=hs&&hs.dataset.to;document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hot'));
      if(g){g.remove();g=null}el.style.opacity='';if(hot)onDrop(to);else if(!moved){const n=Date.now();if(n-(el._lt||0)<320){clearTimeout(el._st);el.classList.toggle('showzh');el._lt=0}else{el._lt=n;el._st=setTimeout(()=>speak(el.dataset.en,'chestnut'),300)}}};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)})}
function burst(x,y){const b=document.createElement('div');b.className='burst';b.style.left=x+'%';b.style.top=y+'%';for(let i=0;i<8;i++){const r=document.createElement('i');r.style.setProperty('--r',i*45+'deg');b.appendChild(r)}$('#panel').appendChild(b);setTimeout(()=>b.remove(),500)}
function prop(who,p){const panel=$('#panel'),c=panel.querySelector(`[data-id="${who}"]`);if(!c)return;const pos=charPos(c),d=document.createElement('div');d.className='prop';d.style.left=(pos.x+7)+'%';d.style.top=(pos.top+18)+'%';d.innerHTML=p.startsWith('img:')?`<div class="pic"><img src="${p.slice(4)}"></div>`:p;panel.appendChild(d);SFX.pop&&SFX.pop()}
function place(pid,i,el,to){if(busy)return;busy=true;const s0=S.pages[pid].stickers[i],alt=to&&s0.to&&s0.to[to],s={...s0,...(alt||{})};el.classList.add('used');path.push(s.say);if(S.pages[pid].line){curLine=S.pages[pid].line;const tl=(s.react||[]).find(x=>x[0]!=='chestnut'&&x[2]);heard=tl?[tl[2].replace(/^\(note\)\s*/,''),tl[3],tl[0]]:null}
  const sl=to?document.querySelector(`.slot[data-to="${to}"]`):$('#slot');document.querySelectorAll('.slot').forEach(x=>{x.classList.add('filled');x.textContent=''});SFX.pop();burst(parseFloat(sl.style.left),parseFloat(sl.style.top)-6);
  showBubble(S.pages[pid].slot,s.say[0],s.say[1]);const lb=[...$('#panel').querySelectorAll('.bubble')].pop();lb&&lb.classList.add('landed');
  let t=700;s.react.forEach(([w,st,en,zh,pr])=>{setTimeout(()=>{setState(w,st);if(en){const n=en.startsWith('(note)');showBubble(w,n?en.slice(7):en,zh,{note:n})}if(pr)prop(w,pr)},t);t+=en?1100:(pr?800:350)});
  setTimeout(function nx(){if(document.querySelector('.wcard'))return setTimeout(nx,400);go(s.next)},t+1500)}
function renderEnd(id){const E=S.endings[id];got.add(id);localStorage.setItem('cd_l1',JSON.stringify([...got]));busy=false;
  const line=curLine,hall=Object.keys(S.pages).find(k=>S.pages[k].line===line);
  const you=path.filter(l=>l&&l[0]&&l[0]!=='…');const they=heard||(line&&S.fallback[line]?[...S.fallback[line],'pia']:null);
  const V=S.vocab,groups=[V.common,...(line&&V[line]?[V[line]]:[])];
  const esc=s=>s.replace(/"/g,'&quot;');
  const ph=(en,zh,who,tag)=>`<button class="ph" data-en="${esc(en)}" data-who="${who}">${tag?`<i class="they">${tag}</i> `:''}${md(en)}<span class="zh">${zh||''}</span></button>`;
  $('#page').innerHTML=topbar("Say something in your first class",true)+`<div class="end">
   <div class="crew">${E.who.map(w=>`<img src="${img(w,E.soft?(w==='chestnut'?'nervous':'neutral'):(w==='chestnut'?'happy':'wave'))}">`).join('')}</div>
   <div class="stamp">${E.en}</div><div class="zh">${E.zh}</div>
   <div class="sum">
    <div class="col"><div class="lt">You said · 你说了</div>${you.length?you.map(l=>ph(l[0],l[1],'chestnut')).join(''):`<div class="none">This time you stayed quiet. Try one line next time: ${ph("I'm into music.","我喜欢音乐。",'chestnut')}</div>`}
     ${they?`<div class="lt">They said · 他们说了</div>${ph(they[0],they[1],they[2])}`:''}</div>
    <div class="col"><div class="lt">Words to steal · 地道表达</div>${groups.map(g=>`<div class="vg"><div class="when">${g.when}</div>${g.w.map(([w,z])=>`<button class="vw" data-en="${esc(w)}"><b class="k">${w}</b><span>${z}</span></button>`).join('')}</div>`).join('')}</div>
   </div>
   <div class="lt">Endings · 结局 ${got.size} / ${ALL.length}</div>
   <div class="egrid">${ALL.map(k=>`<div class="ec ${got.has(k)?'got':''} ${k===id?'now':''}">${got.has(k)?S.endings[k].en:'?'}</div>`).join('')}</div>
   <div class="endbtns">${hall?`<button id="retry">↺ Try again · 再试一次</button>`:''}<button id="again">Change topic · 换个话题</button></div></div>`;
  wireTop();document.querySelectorAll('.ph').forEach(b=>tapHear(b,b.dataset.en,b.dataset.who));document.querySelectorAll('.vw').forEach(b=>b.onclick=e=>wordCard(b.dataset.en,e));
  tapHear($('.stamp'),'');$('.stamp').addEventListener('dblclick',()=>$('.end > .zh').classList.toggle('showzh'));
  SFX[E.soft?'nervous':'happy']();
  $('#again').onclick=()=>{hist=[];path=[];heard=null;curLine=null;go(S.start,false)};
  if(hall)$('#retry').onclick=()=>{hist=[S.start];path=path.slice(0,1);heard=null;go(hall,false)}}
// ---------- first-time demo hand ----------
let handT=[],handEl=null;
function demoHand(){const st=document.querySelector('.sticker'),sl=$('#slot');if(!st||!sl)return;handEl=document.createElement('div');handEl.className='hand';handEl.textContent='👆';document.body.appendChild(handEl);
  const a=st.getBoundingClientRect(),b=sl.getBoundingClientRect();let n=0;
  const loop=()=>{if(!handEl)return;handEl.style.transition='none';handEl.style.left=(a.left+a.width/2-10)+'px';handEl.style.top=(a.top+a.height/2)+'px';handEl.style.opacity=.75;
    handT.push(setTimeout(()=>{if(!handEl)return;handEl.style.transition='all 1.1s ease-in-out';handEl.style.left=(b.left+b.width/2-10)+'px';handEl.style.top=(b.top+b.height/2)+'px'},300));
    handT.push(setTimeout(()=>{if(++n<2)loop();else stopHand()},1900))};loop()}
function stopHand(){if(handEl){handEl.remove();handEl=null;handT.forEach(clearTimeout);localStorage.setItem('cd_seen','1');firstTime=false}}
document.addEventListener('pointerdown',e=>{if(handEl&&!e.target.closest('.sticker'))stopHand()},true);
if(new URLSearchParams(location.search).has('reset')){localStorage.clear();got=new Set();firstTime=true}
go(S.start,false,false);
</script></body></html>
